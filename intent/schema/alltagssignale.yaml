# schema/alltagssignale.yaml
# Alltagsbegriffe → Rechtsgebiet: Signale, die in den Systematik-YAMLs fehlen,
# weil dort juristisches Fachvokabular dominiert. Ergänzung ohne Eingriff in die
# Taxonomie-Dateien. Format identisch zu den Systematik-YAMLs: jede Gruppe hat
# "signale" (Liste) + "typische_rechtsgebiete" (Liste gültiger Slugs).
# Stand: Mai 2026 — erweiterbar

gruppen:

  # ── Verbraucherrecht ──────────────────────────────────────────────────────
  - signale:
      # Widerruf / Fernabsatz
      - Widerruf
      - widerrufen
      - Haustür
      - Haustürgeschäft
      - Widerrufsrecht
      - Widerrufsfrist
      - Haustürvertrag
      - Fernabsatzvertrag
      - Onlineshop
      - online bestellt
      - Abzahlung
      - Ratenkauf
      - Ratenvertrag
      # Plattform / Marktplatz (B2C-Kontext)
      - Plattform
      - Marktplatz
      - Online-Plattform
      - Online-Händler
      - Verkaufsplattform
      # Lieferprobleme
      - nicht geliefert
      - Ware nicht angekommen
      - Lieferung ausgeblieben
      - Paket verloren
      - falsch geliefert
      - falsche Ware geliefert
      - Ware beschädigt angekommen
      # Rückgabe / Rückerstattung verweigert
      - Rückgabe verweigert
      - Rückerstattung verweigert
      - Erstattung verweigert
      - kein Umtausch
      - Geld nicht zurück
      - Kaufpreis nicht zurückerstattet
      # Abo / Kündigung
      - Abo
      - Abonnement
      - nicht kündbar
      - Kündigung verweigert
      - automatisch verlängert
      - Vertragslaufzeit
      - Mindestlaufzeit
      # Irreführende Werbung / Täuschung
      - falsche Werbung
      - Werbung irreführend
      - nicht wie beschrieben
      - Versprechen nicht eingehalten
      - anders als angekündigt
      # Aggressive Vertriebsmethoden
      - unter Druck gesetzt
      - überredet
      - telefonisch aufgedrängt
      - Vertreter überredet
    typische_rechtsgebiete: [verbraucherrecht]

  # ── Grenzüberschreitender Verbraucherkauf (CE-Kennzeichnung, App-Stores, EU-Ausland) ─
  # WICHTIG: Diese Signale IMMER zu verbraucherrecht/kaufrecht routen, NICHT europarecht.
  # europarecht nur bei zwischenstaatlichen Konflikten oder Grundfreiheitsverletzungen.
  - signale:
      - CE-Kennzeichnung
      - CE-Zeichen
      - CE-Konformität
      - Konformitätserklärung
      - App Store
      - Apple Marketplace
      - Google Play
      - Amazon Marketplace
      - eBay-Kauf
      - aus dem Ausland bestellt
      - aus EU-Ausland
      - grenzüberschreitend gekauft
      - ausländischer Händler
      - Händler aus Polen
      - Händler aus Irland
      - Händler aus Tschechien
      - Händler aus China
      - Import
      - Importware
      - importiertes Produkt
      - Zollgebühren
      - aus Drittland
    typische_rechtsgebiete: [verbraucherrecht, kaufrecht]

  # ── Medizinrecht ─────────────────────────────────────────────────────────
  - signale:
      - Arzt
      - Ärztin
      - Krankenhaus
      - Klinik
      - Operation
      - Behandlungsfehler
      - Kunstfehler
      - Aufklärungspflicht
      - Narkose
      - Diagnose falsch
      - ärztlicher Fehler
      - medizinischer Fehler
    typische_rechtsgebiete: [medizinrecht]

  # ── Nachbarrecht ─────────────────────────────────────────────────────────
  - signale:
      - Nachbar
      - Lärm
      - Ruhestörung
      - Immission
      - Grenzabstand
      - Grundstücksgrenze
      - Einfriedung
      - Gartenzaun
      - Überbau
      - Ast überragt
      - Garage Grenze
      - Baulärm
    typische_rechtsgebiete: [nachbarrecht]

  # ── IT-Recht ─────────────────────────────────────────────────────────────
  - signale:
      - SaaS
      - Software
      - Cloud
      - Softwarelizenz
      - IT-Vertrag
      - Softwarevertrag
