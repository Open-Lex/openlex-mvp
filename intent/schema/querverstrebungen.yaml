# schema/querverstrebungen.yaml
# Cross-Domain-Verknüpfungen zwischen Rechtsgebieten
# Quelle: allgemein bekannte Konkurrenz-Lehre, juristische Standardsystematik
# Stand: Mai 2026
# Verwendung: Intent-Skill nutzt diese, um bei jedem Treffer in einer Domain
#             automatisch Hypothesen zu parallelen Anspruchsgrundlagen in
#             anderen Domains zu generieren.
#
# Methodische Grundlage:
# - Strafrechtliche Tat ≠ zivilrechtlicher Anspruch — beides ist separat zu prüfen
# - Schutzgesetzverletzung (§ 823 II BGB) verbindet StGB-Tatbestände mit zivilem Schadensersatz
# - Bei staatlichem Handeln kommt öffentlich-rechtliche Ebene (Amtshaftung, Folgenbeseitigung) hinzu

