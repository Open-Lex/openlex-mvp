konkurrenz_und_doppelrelevanz:
  titel: "Hinweise zu Konkurrenzen"
  prinzipien:
    schutzgesetz_brueckenfunktion:
      titel: "§ 823 Abs. 2 BGB als Brücke zwischen Straf- und Zivilrecht"
      beschreibung: |
        Jeder StGB-Tatbestand, der dem Schutz eines Individuums dient, ist
        ein Schutzgesetz iSd § 823 Abs. 2 BGB. Damit löst praktisch jede
        gegen ein Individuum gerichtete Straftat AUTOMATISCH einen
        zivilrechtlichen Schadensersatzanspruch aus.
      beispiele:
        - "Körperverletzung § 223 StGB → § 823 II BGB + § 223 StGB"
        - "Sachbeschädigung § 303 StGB → § 823 II BGB + § 303 StGB"
        - "Betrug § 263 StGB → § 823 II BGB + § 263 StGB"
      einschraenkung: "Reine Staatsschutz-Delikte (Hochverrat, Landesverrat) sind keine Schutzgesetze."

    persoenlichkeitsrecht_brueckenfunktion:
      titel: "Allgemeines Persönlichkeitsrecht (APR) als zivilrechtliches Pendant"
      beschreibung: |
        Das APR (§ 823 Abs. 1 BGB i.V.m. Art. 2 Abs. 1, Art. 1 Abs. 1 GG)
        bildet die zivilrechtliche Auffangposition für viele Persönlich-
        keitsverletzungen, die auch strafrechtlich relevant sein können.
      beispiele:
        - "Beleidigung § 185 StGB → APR-Verletzung § 823 I BGB"
        - "Heimliche Aufnahme § 201a StGB → APR (informationelle Selbstbestimmung)"
        - "Stalking § 238 StGB → APR + Freiheit"

    amtshaftung_brueckenfunktion:
      titel: "§ 839 BGB i.V.m. Art. 34 GG bei staatlichem Handeln"
      beschreibung: |
        Bei rechtswidrigem Handeln von Amtsträgern haftet der Staat
        (nicht der Beamte persönlich). Häufig kombiniert mit straf-
        rechtlichen Tatbeständen (§§ 339, 340, 343 StGB).
      beispiele:
        - "Polizeigewalt § 340 StGB → § 839 BGB i.V.m. Art. 34 GG"
        - "Rechtsbeugung § 339 StGB → Amtshaftung"

    sittenwidrigkeit_brueckenfunktion:
      titel: "§ 826 BGB als deliktischer Auffangtatbestand"
      beschreibung: |
        § 826 BGB greift bei sittenwidriger vorsätzlicher Schädigung —
        oft parallel zu Vorsatzdelikten des StGB anwendbar.
      beispiele:
        - "Betrug § 263 StGB → § 826 BGB"
        - "Erpressung § 253 StGB → § 826 BGB"
        - "Insolvenzverschleppung § 15a InsO → § 826 BGB"

verwendung_im_intent_skill:
  signal_matching: |
    Bei JEDEM Signal-Treffer in strafrecht_systematik.yaml automatisch
    die entsprechende Querverstrebung aus dieser YAML abrufen. Beispiel:
    User sagt "geschlagen" → strafrechtlich § 223 StGB → automatisch
    parallele Hypothese: zivilrechtlich § 823 BGB + Schmerzensgeld.
    
  routing_logik: |
    Bei Querverstrebungs-Treffer in vermutete_rechtsgebiete-Liste MEHRERE
    Skills aufnehmen, nicht nur das primäre. Beispiel:
    Körperverletzung → ["strafrecht", "verkehrsrecht" wenn Unfall,
    "arbeitsrecht" wenn am Arbeitsplatz]
    
  begehr_klarung: |
    Bei doppelt relevanten Konstellationen GEZIELT nachfragen, was der
    Nutzer eigentlich will:
    - Strafanzeige? → Strafrecht-Pfad
    - Schadensersatz/Schmerzensgeld? → Zivilrecht-Pfad  
    - Beides? → Beide Pfade parallel
    - Unterlassung weiterer Übergriffe? → § 1004 BGB analog
    - Schutz (z.B. Wohnung)? → GewSchG
    
  hypothesen_test_template: |
    "Habe ich richtig verstanden: Es geht Ihnen darum, dass [Sachverhalt].
    Wollen Sie:
    a) eine Strafanzeige erstatten,
    b) Schadensersatz oder Schmerzensgeld einklagen,
    c) erreichen, dass [die Person] das in Zukunft unterlässt,
    oder mehreres davon?"
    
  sensibilitaet_handling: |
    Bei Konstellationen mit Flag "hoch" oder "sehr hoch":
    - Hilfsangebote unaufgefordert anzeigen
    - Empathisch formulieren
    - Nicht direkt zu Norm-Diskussion springen
    - Bei akuter Gefahr: 110 / Hilfetelefon priorisieren
    
  multi_skill_handoff: |
    Im Übergabe-JSON unter vermutete_rechtsgebiete ALLE relevanten
    Skills aufnehmen. Skill-Orchestrator entscheidet später, ob
    parallel oder sequentiell beantwortet wird.